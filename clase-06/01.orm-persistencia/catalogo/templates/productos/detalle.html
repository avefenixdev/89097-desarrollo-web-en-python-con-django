{% extends "productos/base.html" %}

{% block contenido %}
    <h1>Detalle de producto {{ producto.nombre }}</h1>
    <p>{{producto.descripcion|default:"Sin descripción"}}</p>
    <p>Precio: {{ producto.precio }}</p>
    <p>Stock: {{ producto.stock }}</p>
    <a href="{% url 'productos:editar' producto.pk %}" class="btn btn-primary">Editar</a>
    <!-- <a href="{{producto.pk}}/editar/" class="btn btn-primary">Editar</a> -->
{% endblock %}
