<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto detalle {{ producto.nombre }}</title>
</head>
<body>
    <h1>{{ producto.nombre|upper }}</h1>
    <p>Precio: ${{ producto.precio|floatformat:2 }}</p>
    <p>Stock: {{ producto.stock }}</p>
</body>
</html>
